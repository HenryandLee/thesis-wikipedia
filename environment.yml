name: wikipedia_research
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pandas>=1.5.0
  - numpy>=1.23.0
  - scipy>=1.9.0
  - statsmodels>=0.13.0
  - matplotlib>=3.6.0
  - seaborn>=0.12.0
  - requests>=2.28.0
  - pyarrow>=10.0.0  # for parquet support
  - jupyter>=1.0.0
  - notebook>=6.5.0
  - pip
  - pip:
    - linearmodels>=4.27  # for panel regression with fixed effects

